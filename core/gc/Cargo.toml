[package]
name = "boa_gc"
description = "Garbage collector for the Boa JavaScript engine."
keywords = ["javascript", "js", "garbage", "memory"]
categories = ["command-line-utilities"]
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# Enable default implementations of trace and finalize for the thin-vec crate
thin-vec = ["dep:thin-vec", "oscars?/thin-vec"]
# Enable default implementations of trace and finalize for some `ICU4X` types
icu = ["dep:icu_locale_core", "oscars?/icu"]
# Enable default implementations of trace and finalize for the `boa_string` crate
boa_string = ["dep:boa_string"]
# Enable default implementations of trace and finalize for the `either` crate
either = ["dep:either", "oscars?/either"]
# Enable default implementations of trace and finalize for the arrayvec crate
arrayvec = ["dep:arrayvec", "oscars?/arrayvec"]
default = []
boa_gc_backend = []
oscars_backend = ["dep:oscars", "dep:typeid", "oscars?/std", "boa_string?/oscars_backend"]

[dependencies]
boa_macros.workspace = true
hashbrown.workspace = true

boa_string = { workspace = true, optional = true }
either = { workspace = true, optional = true }
thin-vec = { workspace = true, optional = true }
icu_locale_core = { workspace = true, optional = true }
arrayvec = { workspace = true, optional = true }
oscars = { git = "https://github.com/boa-dev/oscars.git", branch = "main", features = ["null_collector_branded"], optional = true }
typeid = { workspace = true, optional = true }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
