[package]
name = "boa_wpt"
publish = false
version = "0.1.0"
edition = "2021"

[dependencies]
boa_engine = { path = "../../core/engine" }
boa_gc = { path = "../../core/gc" }
boa_runtime = { path = "../../core/runtime", features = ["all"] }
rstest = "0.28.0"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
url = { version = "2.5.9", features = [] }

[build-dependencies]
git2 = "0.21.0"
toml = "1.2.1"
serde = { version = "1.0.229", features = ["derive"] }
